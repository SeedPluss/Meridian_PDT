  <link href="https://fonts.googleapis.com/css2?family=VT323&family=Share+Tech+Mono&display=swap" rel="stylesheet">

  <style>
    /* ── Reset ─────────────────────────────────────────────────────────── */
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    button { font-family: inherit; }

    /* ── Color tokens ──────────────────────────────────────────────────── */
    :root {
      --seegson-bright: #00ff66;
      --seegson-main:   #00cc52;
      --seegson-mid:    #00993d;
      --seegson-dim:    #006629;
      --seegson-ghost:  #003315;
      --crt-black:      #000a04;
      --wy-bright:      #4488ff;
      --wy-main:        #2266dd;
      --warning-amber:  #ffaa00;
      --critical-red:   #ff2a2a;
      --signal-cyan:    #00ddff;
    }

    /* ── Page layout ───────────────────────────────────────────────────── */
    html, body {
      width: 100%; height: 100%;
      background: #060806;
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh;
    }

    #root {
      display: flex; align-items: center; justify-content: center;
    }

    /* On small screens: fill viewport */
    @media (max-width: 430px) {
      #root > div {
        width: 100vw !important;
        height: 100dvh !important;
      }
    }

    /* ── CRT Scanlines ─────────────────────────────────────────────────── */
    body::after {
      content: '';
      position: fixed; inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0, 0, 0, 0.13) 2px,
        rgba(0, 0, 0, 0.13) 4px
      );
      pointer-events: none;
      z-index: 9999;
    }

    /* ── Vignette ──────────────────────────────────────────────────────── */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background: radial-gradient(
        ellipse at center,
        transparent 55%,
        rgba(0, 0, 0, 0.65) 100%
      );
      pointer-events: none;
      z-index: 9998;
    }

    /* ── Scrollbar suppression ─────────────────────────────────────────── */
    ::-webkit-scrollbar { display: none; }

    /* ── Keyframe animations ───────────────────────────────────────────── */

    @keyframes blink {
      0%,  49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    @keyframes shake {
      0%,  100% { transform: translateX(0);   }
      20%        { transform: translateX(-5px); }
      40%        { transform: translateX(5px);  }
      60%        { transform: translateX(-4px); }
      80%        { transform: translateX(4px);  }
    }

    @keyframes alertPulse {
      0%,  100% { background-color: #0a0000; }
      50%        { background-color: #1a0000; }
    }

    @keyframes countdownPulse {
      0%,  100% { opacity: 1;   }
      50%        { opacity: 0.6; }
    }

    @keyframes radarSweep {
      from { transform: rotate(0deg);   }
      to   { transform: rotate(360deg); }
    }

    /* ── Phosphor glow helper class ─────────────────────────────────────── */
    .text-focus {
      text-shadow: 0 0 8px currentColor;
    }

    /* ── Cursor via pseudo ─────────────────────────────────────────────── */
    .cursor::after {
      content: '█';
      animation: blink 0.65s steps(1) infinite;
    }
  </style>
</head>
