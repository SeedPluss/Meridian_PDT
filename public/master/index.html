<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MERIDIAN MASTER CONTROL</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=VT323&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    :root {
      --bright: #00ff66; --main: #00cc52; --mid: #00993d;
      --dim: #006629;   --ghost: #003315; --black: #000a04;
      --wy: #2266dd;    --amber: #ffaa00; --red: #ff2a2a;
      --cyan: #00ddff;
    }
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    html, body { width:100%; height:100%; background:var(--black); overflow:hidden; }
    body { font-family:'VT323', monospace; color:var(--main); }
    ::-webkit-scrollbar { width:4px; }
    ::-webkit-scrollbar-track { background:var(--black); }
    ::-webkit-scrollbar-thumb { background:var(--dim); }
    button { font-family:'VT323', monospace; }
    input, textarea, select { font-family:'Share Tech Mono', monospace; background:transparent; color:var(--main); border:1px solid var(--dim); outline:none; }
    select option { background:var(--black); color:var(--main); }

    @keyframes blink { 0%,49%{opacity:1} 50%,100%{opacity:0} }
    @keyframes alertPulse { 0%,100%{background-color:#0a0000} 50%{background-color:#1a0000} }
    @keyframes countdownPulse { 0%,100%{opacity:1} 50%{opacity:0.6} }
    @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-4px)} 75%{transform:translateX(4px)} }

    body::after {
      content:''; position:fixed; inset:0; pointer-events:none; z-index:9999;
      background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.1) 2px,rgba(0,0,0,0.1) 4px);
    }
    #root { width:100%; height:100vh; display:flex; flex-direction:column; }
  </style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js"
  integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"
  integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"
  integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="master-app.jsx"></script>
</body>
</html>
